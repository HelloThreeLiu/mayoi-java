name: debug-sh

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: traceC - /bin/sh (posix mode) instrumented ensure_jre
        run: |
          awk '{ print }
            NR == 123 { print "echo DBGENTER plat_arch-set=${plat_arch+YES}" }
            NR == 151 { print "echo DBGBEFORESTEP plat_arch-set=${plat_arch+YES}" }
            NR == 153 { print "exit 0" }' bootstrap/bootstrap.sh > /tmp/headC.sh
          sh -x /tmp/headC.sh 2>&1 | head -70 || true
      - name: traceD - /bin/bash (non-posix) same file
        run: |
          /bin/bash -x /tmp/headC.sh 2>&1 | grep -E "DBGENTER|DBGBEFORESTEP|plat_arch|unbound" | head -10 || true
      - name: minimal local-interaction repro
        run: |
          /bin/sh -c 'set -eu
            plat_arch=aarch64
            f() {
              local need=true marker_val="" inner="" d
              local jre_marker="/tmp/x"
              local jre_desired=""
              echo "in-f plat_arch-set=${plat_arch+YES}"
              g
            }
            g() { echo "in-g plat_arch-set=${plat_arch+YES}"; }
            f
          ' 2>&1 || true
