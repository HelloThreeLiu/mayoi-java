name: debug-sh

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: file bytes sanity
        run: |
          file bootstrap/bootstrap.sh
          sed -n '43,52p' bootstrap/bootstrap.sh | cat -A
          grep -n "^ensure_jre$" bootstrap/bootstrap.sh
      - name: traceA - matrix only (exit after line 52)
        run: |
          awk 'NR == 53 { print "exit 0" } { print }' bootstrap/bootstrap.sh > /tmp/headA.sh
          sh -x /tmp/headA.sh 2>&1 | head -50 || true
      - name: traceB - everything up to the ensure_jre call
        run: |
          awk '/^ensure_jre$/ && !done { print "exit 0"; done = 1 } { print }' bootstrap/bootstrap.sh > /tmp/headB.sh
          sh -x /tmp/headB.sh 2>&1 | head -80 || true
      - name: full script with -x, killed after 25s (before big downloads finish)
        run: |
          sh -x bootstrap/bootstrap.sh > /tmp/full.log 2>&1 & pid=$!
          sleep 25
          kill $pid 2>/dev/null || true
          sleep 1
          sed -n '1,60p' /tmp/full.log
          echo "---- tail ----"
          tail -20 /tmp/full.log
